<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryNest Admin Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ff;
      color: #333;
    }

    header {
      background: white;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      color: #6c3cff;
    }

    .logout {
      border: none;
      background: #6c3cff;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card h2 {
      color: #6c3cff;
      margin-top: 0;
    }
  </style>
</head>

<body>

<header>
  <h1>StoryNest</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome, Admin 👋</h2>
    <p>Manage your StoryNest personalized baby books from here.</p>
  </div>

  <div class="cards">

    <div class="card">
      <h2>📚 Orders</h2>
      <p>View and manage customer orders.</p>
    </div>

    <div class="card">
      <h2>💳 Payments</h2>
      <p>View successful payments.</p>
    </div>

    <div class="card">
      <h2>📖 Story Books</h2>
      <p>Manage personalized books.</p>
    </div>

    <div class="card">
      <h2>🌍 Languages</h2>
      <p>English, Bengali and Hindi.</p>
    </div>

  </div>

</div>

<script>
function logout() {
  window.location.href = "/admin.html";
}
</script>

</body>
</html>
