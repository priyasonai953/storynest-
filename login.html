<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryNest Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3ff;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #6c3cff;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #6c3cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d33;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>StoryNest</h1>
    <p>Admin Login</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Admin Password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      try {
        const response = await fetch("/api/admin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        message.textContent =
  data.message ||
  JSON.stringify(data);

      } catch (error) {
        message.textContent = "Login failed. Please try again.";
      }
    });
  </script>

</body>
</html>
